<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>資訊儀表板</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 針對舊版 iOS 確保 100% 填滿螢幕的終極解法 */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* 防止整個頁面出現原生捲軸 */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            color: #1C1C1E;
            padding: 12px; 
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        
        .dashboard {
            width: 100%;
            max-width: 1024px;
            height: 100%; /* 強制填滿 body 扣除 padding 後的高度 */
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            /* 移除 display: flex; 改為相對定位作為內部絕對定位的容器 */
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            background: linear-gradient(180deg, #F0F8FF 0%, #FFFFFF 100%);
            border-bottom: 1px solid #E5E5EA;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            /* 鎖定 Header 高度 */
            height: 110px; 
            position: absolute;
            top: 0; left: 0; right: 0;
        }
        .header-left {
            font-size: 4.5rem;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -1.5px;
        }
        .header-center {
            text-align: left;
            padding-left: 20px;
            flex: 1;
        }
        .header-center .day-of-week {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .header-center .date-loc {
            font-size: 1.05rem;
            color: #8E8E93;
        }
        .header-right { 
            text-align: right; 
            max-width: 45%; /* 限制右側寬度避免文字太長蓋過中間 */
        }
        .header-right .temp-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .header-right .current-emoji {
            font-size: 3.5rem; /* 再稍微放大當前天氣圖案 */
            margin-right: 12px;
        }
        .header-right .temp {
            font-size: 4rem;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -1px;
        }
        .header-right .weather-desc {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 8px;
            line-height: 1.3;
            /* 強制限制高度並隱藏溢出，取代舊版可能失效的 line-clamp */
            height: 2.6em; 
            overflow: hidden;
            white-space: normal;
            text-overflow: ellipsis;
        }
        .header-right .humidity { font-size: 0.95rem; color: #8E8E93; margin-top: 4px;}

        /* 中間內容區：放棄 Flex 高度，改用絕對定位釘死 */
        .main-content {
            display: flex;
            position: absolute;
            top: 110px; /* Header 的高度 */
            bottom: 140px; /* 預留給 Clocks (約90px) + Footer (約50px) 的高度 */
            left: 0; right: 0;
            border-bottom: 1px solid #E5E5EA;
        }
        
        .section {
            flex: 1;
            /* 舊版 iOS Safari 兼容：確保子元素知道自己要填滿 */
            width: 50%;
            height: 100%;
            position: relative; 
        }
        .section-left { border-right: 1px solid #E5E5EA; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #F9F9FB;
            border-bottom: 1px solid #E5E5EA;
            font-weight: 600;
            font-size: 1.05rem;
            /* 鎖死標題列高度 */
            height: 45px;
            position: absolute;
            top: 0; left: 0; right: 0;
        }
        
        .section {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 50%;
            height: 100%;
        }
        .section-left { border-right: 1px solid #E5E5EA; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #F9F9FB;
            border-bottom: 1px solid #E5E5EA;
            font-weight: 600;
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        
        .refresh-btn, .text-btn {
            border: none;
            background: transparent;
            color: #007AFF;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
        }

        /* 列表容器：使用絕對定位填滿剩餘空間，並開啟平滑滾動 */
        .bus-list, .forecast-table-container { 
            position: absolute;
            top: 45px; /* section-header 的高度 */
            bottom: 0; left: 0; right: 0;
            padding: 0 24px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* 舊版 iOS 平滑滾動必備 */
        }
        
        /* 移除原有的 forecast-table-container 額外設定，因為已經合併到上面了 */
        
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0; /* 加大行距，讓版面看起來更舒適不空洞 */
            border-bottom: 1px solid #F2F2F7;
        }
        .bus-item:last-child { border-bottom: none; }
        .bus-route-info { display: flex; align-items: center; }
        .bus-route-info .route-num {
            background-color: #E3002B;
            color: #FFFFFF;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 8px;
            margin-right: 12px;
            min-width: 55px;
            text-align: center;
        }
        .bus-route-info .dest-info { display: flex; flex-direction: column; }
        .bus-route-info .destination { font-size: 1.1rem; font-weight: 600; color: #1C1C1E; }
        .bus-eta {
            font-size: 1.6rem;
            font-weight: 700;
            color: #34C759;
            text-align: right;
        }
        .bus-eta span.min-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: #8E8E93;
            margin: 0 6px 0 2px;
        }

        .forecast-table-container { 
            padding: 0; 
            flex: 1;
            overflow-y: auto;
        }
        .forecast-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 1rem; 
            table-layout: fixed; 
        }
        .forecast-table th {
            text-align: center;
            padding: 10px 8px;
            border-bottom: 1px solid #E5E5EA;
            font-weight: 600;
            color: #8E8E93;
            font-size: 0.9rem;
            background-color: #FFFFFF;
        }
        .forecast-table td {
            padding: 14px 8px;
            border-bottom: 1px solid #F2F2F7;
            text-align: center;
            vertical-align: middle;
        }
        .forecast-table tr:last-child td { border-bottom: none; }
        
        .forecast-table td.day-col { text-align: left; font-weight: 600; color: #1C1C1E; padding-left: 24px;}
        
        .forecast-table td.desc-col { 
            text-align: left; 
            font-size: 1rem;
            line-height: 1.4;
            white-space: normal; 
        }
        .forecast-table .wx-icon { 
            font-size: 2rem; 
            margin-right: 8px; 
            vertical-align: middle;
        }
        .forecast-table td.temp-col { font-weight: 700; font-size: 1.1rem; }

        .clocks-section {
            display: flex;
            background-color: #F9F9FB;
            border-bottom: 1px solid #E5E5EA;
            /* 釘死在底部 Footer 之上 */
            position: absolute;
            bottom: 50px; left: 0; right: 0;
            height: 90px;
        }
        .clock-item {
            flex: 1;
            text-align: center;
            padding: 16px 5px;
            border-right: 1px solid #E5E5EA;
            /* 防止舊版 Flex 失效被壓縮 */
            min-width: 0; 
        }
        .clock-item {
            flex: 1;
            text-align: center;
            padding: 16px 5px;
            border-right: 1px solid #E5E5EA;
        }
        .clock-item:last-child { border-right: none; }
        .clock-city { font-size: 0.85rem; font-weight: 600; color: #8E8E93; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
        .clock-time { font-size: 1.6rem; font-weight: 300; letter-spacing: -0.5px; }
        .clock-time span.day { font-size: 0.95rem; color: #8E8E93; margin-right: 6px; font-weight: 500; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            font-size: 0.85rem;
            color: #8E8E93;
            background-color: #FFFFFF;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            /* 釘死在最底部 */
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50px;
        }

        .modal-overlay {
            /* 在舊版 iOS 中，fixed position 有時會亂跑，這部分我先保留您的原寫法，
               如果對話框有問題我們再改用 absolute 蓋住整個 dashboard */
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #fff; padding: 24px; border-radius: 18px; width: 90%; max-width: 400px;
        }
        .modal-content input, .modal-content select {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #D1D1D6; border-radius: 10px; font-size: 1.05rem;
        }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.05rem; font-weight: 600; }
        .btn-cancel { background: #E5E5EA; color: #1C1C1E; }
        .btn-save { background: #007AFF; color: #fff; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="header-left" id="current-time">--:--</div>
        <div class="header-center">
            <div class="day-of-week" id="current-day">星期-</div>
            <div class="date-loc" id="current-date-loc">----年--月--日 · <span id="display-stop-name">載入中...</span></div>
        </div>
        <div class="header-right">
            <div class="temp-container">
                <span class="current-emoji" id="current-wx-emoji">--</span>
                <div class="temp" id="current-temp">--°C</div>
            </div>
            <div class="weather-desc" id="current-weather-desc">載入中...</div>
            <div class="humidity" id="current-humidity">濕度 --%</div>
        </div>
    </div>

    <div class="main-content">
        <div class="section section-left">
            <div class="section-header">
                <span>九巴預計到站時間</span>
                <button class="refresh-btn" onclick="app.updateBusData()">重新整理</button>
            </div>
            <div class="bus-list" id="bus-list">
                <div style="padding: 20px; text-align: center; color: #8E8E93;">請設定巴士站...</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <span>香港天文台天氣預報</span>
                <button class="refresh-btn" onclick="app.updateWeatherData()">重新整理</button>
            </div>
            <div class="forecast-table-container">
                <table class="forecast-table">
                    <thead>
                        <tr>
                            <th style="width: 12%; text-align: left; padding-left: 24px;">日</th>
                            <th style="width: 48%; text-align: left;">天氣</th>
                            <th style="width: 9%;">高</th>
                            <th style="width: 9%;">低</th>
                            <th style="width: 12%;">濕度</th>
                            <th style="width: 10%;">降</th>
                        </tr>
                    </thead>
                    <tbody id="forecast-list">
                        <tr><td colspan="6" style="text-align: center; padding: 20px; color: #8E8E93;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="clocks-section">
        <div class="clock-item">
            <div class="clock-city">東京 Tokyo</div>
            <div class="clock-time" id="clock-tyo"><span class="day">---</span> --:--</div>
        </div>
        <div class="clock-item">
            <div class="clock-city">倫敦 London</div>
            <div class="clock-time" id="clock-lon"><span class="day">---</span> --:--</div>
        </div>
        <div class="clock-item">
            <div class="clock-city">紐約 New York</div>
            <div class="clock-time" id="clock-ny"><span class="day">---</span> --:--</div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">
            <span id="update-status">更新中...</span>
        </div>
        <div class="footer-right">
            <button class="text-btn" onclick="app.openBusSettings()">⚙ 設定巴士站</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="busModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px; font-size: 1.25rem; font-weight: 700;">設定關注巴士站</h3>
        <p style="font-size:0.85rem; color:#8E8E93; margin-bottom:15px; line-height: 1.4;">請先輸入路線號碼，系統會搜尋該路線途經的車站。</p>
        
        <label style="font-weight: 600; font-size: 0.95rem; margin-bottom: 5px; display: block;">1. 路線號碼 (如 1A, 281A)</label>
        <input type="text" id="routeInput" placeholder="輸入路線號碼..." style="text-transform: uppercase;">
        <button class="btn btn-save" style="width:100%; margin-bottom:20px;" onclick="app.searchRouteStops()">搜尋車站</button>
        
        <div id="stopSelectionArea" style="display:none;">
            <label style="font-weight: 600; font-size: 0.95rem; margin-bottom: 5px; display: block;">2. 選擇方向與車站</label>
            <select id="stopSelect"></select>
            
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="app.closeBusSettings()">取消</button>
                <button class="btn btn-save" onclick="app.saveBusSetting()">儲存並載入</button>
            </div>
        </div>
        <div id="modalMsg" style="color:#FF3B30; font-size:0.9rem; margin-top:10px; font-weight: 500;"></div>
        
        <button class="btn btn-cancel" id="cancelSearchBtn" style="width:100%; margin-top:10px;" onclick="app.closeBusSettings()">關閉</button>
    </div>
</div>

<script>
var app = (function() {
    var lastWeatherUpdate = "--:--";
    var lastBusUpdate = "--:--";
    var userStopId = localStorage.getItem("kmb_stop_id") || "";
    var userStopName = localStorage.getItem("kmb_stop_name") || "尚未設定車站";
    var currentRouteData = [];

    function fetchJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try { callback(null, JSON.parse(xhr.responseText)); } 
                    catch (e) { callback(e, null); }
                } else { callback(new Error("Request Failed"), null); }
            }
        };
        xhr.timeout = 10000;
        xhr.ontimeout = function () { callback(new Error("Timeout"), null); };
        xhr.open("GET", url, true);
        xhr.send();
    }

    function padZero(num) { return num < 10 ? "0" + num : num; }

    function getIOSEmojiIcon(code) {
        var c = parseInt(code, 10);
        if (c >= 50 && c <= 51) return "☀️";
        if (c >= 52 && c <= 54) return "⛅️";
        if (c >= 60 && c <= 61) return "☁️";
        if (c >= 62 && c <= 64) return "🌦";
        if (c == 65) return "⛈";
        if (c >= 70 && c <= 75) return "🌧";
        if (c >= 76 && c <= 77) return "霧";
        if (c >= 80 && c <= 85) return "💨";
        if (c >= 90 && c <= 93) return "🌡";
        return "🌥";
    }

    function colorizeWeatherText(text) {
        if (!text) return "--";
        return text
            .replace(/雨/g, '<span style="color: #007AFF; font-weight: 600;">雨</span>')
            .replace(/雷暴/g, '<span style="color: #5856D6; font-weight: 600;">雷暴</span>')
            .replace(/晴/g, '<span style="color: #FF9500; font-weight: 600;">晴</span>')
            .replace(/酷熱|熱/g, '<span style="color: #FF3B30; font-weight: 600;">$&</span>')
            .replace(/冷|涼/g, '<span style="color: #32ADE6; font-weight: 600;">$&</span>')
            .replace(/雲/g, '<span style="color: #8E8E93; font-weight: 600;">雲</span>');
    }

    function updateLocalTime() {
        var now = new Date();
        document.getElementById("current-time").innerText = padZero(now.getHours()) + ":" + padZero(now.getMinutes());
        var days = ["日", "一", "二", "三", "四", "五", "六"];
        document.getElementById("current-day").innerText = "星期" + days[now.getDay()];
        
        var dateStr = now.getFullYear() + "年" + padZero(now.getMonth() + 1) + "月" + padZero(now.getDate()) + "日";
        document.getElementById("current-date-loc").innerHTML = dateStr + " · " + userStopName;
        updateFooterStatus();
    }

    function updateWorldClocks() {
        var now = new Date();
        var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        function calcTime(offsetHours) {
            var nd = new Date(utc + (3600000 * offsetHours));
            var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            return { day: days[nd.getDay()], time: padZero(nd.getHours()) + ":" + padZero(nd.getMinutes()) };
        }
        var tyo = calcTime(9), lon = calcTime(1), ny = calcTime(-4);
        document.getElementById("clock-tyo").innerHTML = '<span class="day">' + tyo.day + '</span> ' + tyo.time;
        document.getElementById("clock-lon").innerHTML = '<span class="day">' + lon.day + '</span> ' + lon.time;
        document.getElementById("clock-ny").innerHTML = '<span class="day">' + ny.day + '</span> ' + ny.time;
    }

    function updateWeatherData() {
        fetchJSON("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc", function(err, data) {
            if (!err && data) {
                if (data.temperature && data.temperature.data && data.temperature.data[0]) {
                    var tempVal = data.temperature.data[0].value;
                    var tempEl = document.getElementById("current-temp");
                    tempEl.innerText = tempVal + "°C";
                    if (tempVal >= 30) tempEl.style.color = "#FF3B30";
                    else if (tempVal <= 20) tempEl.style.color = "#007AFF";
                    else tempEl.style.color = "#1C1C1E";
                }
                if (data.humidity && data.humidity.data && data.humidity.data[0]) {
                    document.getElementById("current-humidity").innerText = "濕度 " + data.humidity.data[0].value + "%";
                }
                if (data.icon && data.icon.length > 0) {
                    document.getElementById("current-wx-emoji").innerText = getIOSEmojiIcon(data.icon[0]);
                }
                lastWeatherUpdate = padZero(new Date().getHours()) + ":" + padZero(new Date().getMinutes());
                updateFooterStatus();
            }
        });

        fetchJSON("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc", function(err, data) {
            if (!err && data) {
                if (data.generalSituation) {
                    // 解除 15 字限制，讓 CSS 控制兩行顯示
                    var desc = data.generalSituation.split("。")[0];
                    document.getElementById("current-weather-desc").innerHTML = colorizeWeatherText(desc);
                }
                if (data.weatherForecast && data.weatherForecast.length > 0) {
                    var html = "";
                    var limit = Math.min(data.weatherForecast.length, 5); 
                    for (var i = 0; i < limit; i++) {
                        var day = data.weatherForecast[i];
                        var shortWeek = day.week.replace("星期", "周");
                        
                        html += "<tr>";
                        html += "<td class='day-col'>" + shortWeek + "</td>";
                        html += "<td class='desc-col'><span class='wx-icon'>" + getIOSEmojiIcon(day.ForecastIcon) + "</span> <span class='desc-text'>" + colorizeWeatherText(day.forecastWeather) + "</span></td>";
                        html += "<td class='temp-col' style='color: #FF3B30;'>" + day.forecastMaxtemp.value + "°</td>";
                        html += "<td class='temp-col' style='color: #007AFF;'>" + day.forecastMintemp.value + "°</td>";
                        var hum = (day.forecastMinrh && day.forecastMaxrh) ? day.forecastMinrh.value + "-" + day.forecastMaxrh.value + "%" : "--";
                        html += "<td>" + hum + "</td>";
                        html += "<td>" + (day.PSR || "--") + "</td>";
                        html += "</tr>";
                    }
                    document.getElementById("forecast-list").innerHTML = html;
                }
            }
        });
    }

    function updateBusData() {
        if (!userStopId) {
            document.getElementById("bus-list").innerHTML = '<div style="padding:20px;text-align:center;color:#8E8E93;">請點擊右下角設定巴士站</div>';
            return;
        }

        var url = "https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/" + userStopId;
        fetchJSON(url, function(err, response) {
            if (err || !response || !response.data) {
                document.getElementById("bus-list").innerHTML = '<div style="padding:20px;text-align:center;color:#E3002B;">無法取得資料，請稍後再試</div>';
                return;
            }

            var routesMap = {};
            var nowTime = new Date().getTime();

            for (var i = 0; i < response.data.length; i++) {
                var item = response.data[i];
                if (!item.eta) continue;

                var etaStr = item.eta.replace(/-/g, '/').replace('T', ' ').split('+')[0];
                var etaTime = new Date(etaStr).getTime();
                var diffMin = Math.floor((etaTime - nowTime) / 60000);
                
                if (diffMin < 0) continue; 

                var key = item.route + "-" + item.dir + "-" + item.dest_tc;
                if (!routesMap[key]) {
                    routesMap[key] = { route: item.route, dest: item.dest_tc, etas: [] };
                }
                if (routesMap[key].etas.length < 3) {
                    routesMap[key].etas.push(diffMin);
                }
            }

            var parsedData = [];
            for (var k in routesMap) {
                if (routesMap.hasOwnProperty(k)) {
                    // 修復：確保 ETA 時間由小到大排序 (解決 8分 20分 8分 的錯亂問題)
                    routesMap[k].etas.sort(function(a, b) { return a - b; });
                    parsedData.push(routesMap[k]);
                }
            }
            
            parsedData.sort(function(a, b) {
                return parseInt(a.route) - parseInt(b.route);
            });

            if(parsedData.length === 0) {
                document.getElementById("bus-list").innerHTML = '<div style="padding:20px;text-align:center;color:#8E8E93;">此站暫無預計到站資料</div>';
            } else {
                renderBusList(parsedData);
            }
        });
    }

    function renderBusList(busData) {
        var html = "";
        // 放大到顯示 8 班車，並配合 overflow-y 滑動
        for (var i = 0; i < Math.min(busData.length, 8); i++) { 
            var bus = busData[i];
            html += '<div class="bus-item">';
            html += '  <div class="bus-route-info">';
            html += '    <div class="route-num">' + bus.route + '</div>';
            html += '    <div class="dest-info">';
            html += '      <span class="destination">往 ' + bus.dest + '</span>';
            html += '    </div>';
            html += '  </div>';
            html += '  <div class="bus-eta">';
            for (var j = 0; j < bus.etas.length; j++) {
                var minTxt = bus.etas[j] === 0 ? "即將" : bus.etas[j] + '<span class="min-text">分</span> ';
                html += minTxt;
            }
            html += '  </div>';
            html += '</div>';
        }
        document.getElementById("bus-list").innerHTML = html;
        lastBusUpdate = padZero(new Date().getHours()) + ":" + padZero(new Date().getMinutes());
        updateFooterStatus();
    }

    function updateFooterStatus() {
        var now = new Date();
        var pageUpdate = padZero(now.getHours()) + ":" + padZero(now.getMinutes()) + ":" + padZero(now.getSeconds());
        document.getElementById("update-status").innerText = "天氣: " + lastWeatherUpdate + " | 巴士: " + lastBusUpdate + " | 頁面: " + pageUpdate;
    }

    function openBusSettings() {
        document.getElementById("busModal").style.display = "flex";
        document.getElementById("routeInput").value = "";
        document.getElementById("stopSelectionArea").style.display = "none";
        document.getElementById("cancelSearchBtn").style.display = "block";
        document.getElementById("modalMsg").innerText = "";
    }

    function closeBusSettings() {
        document.getElementById("busModal").style.display = "none";
    }

    function searchRouteStops() {
        var route = document.getElementById("routeInput").value.trim().toUpperCase();
        var msgEl = document.getElementById("modalMsg");
        if (!route) { msgEl.innerText = "請輸入路線號碼"; return; }
        
        msgEl.style.color = "#8E8E93";
        msgEl.innerText = "搜尋中，請稍候...";
        
        fetchJSON("https://data.etabus.gov.hk/v1/transport/kmb/route-stop/" + route + "/inbound/1", function(errIn, dataIn) {
            fetchJSON("https://data.etabus.gov.hk/v1/transport/kmb/route-stop/" + route + "/outbound/1", function(errOut, dataOut) {
                var allStops = [];
                if (!errIn && dataIn.data) allStops = allStops.concat(dataIn.data);
                if (!errOut && dataOut.data) allStops = allStops.concat(dataOut.data);
                
                if (allStops.length === 0) {
                    msgEl.style.color = "#FF3B30";
                    msgEl.innerText = "找不到該路線的車站，請檢查號碼是否正確。";
                    return;
                }

                msgEl.innerText = "正在解析車站名稱...";
                currentRouteData = allStops;
                var selectEl = document.getElementById("stopSelect");
                selectEl.innerHTML = "";
                
                var limit = Math.min(allStops.length, 60);
                var completed = 0;

                for (var i = 0; i < limit; i++) {
                    (function(stopObj, index) {
                        fetchJSON("https://data.etabus.gov.hk/v1/transport/kmb/stop/" + stopObj.stop, function(err, stopData) {
                            completed++;
                            var stopName = stopObj.stop; 
                            if (!err && stopData && stopData.data) {
                                stopName = stopData.data.name_tc;
                            }
                            
                            var dirStr = stopObj.bound === "I" ? "[回程]" : "[去程]";
                            var option = document.createElement("option");
                            option.value = stopObj.stop;
                            option.text = dirStr + " " + stopName;
                            option.setAttribute("data-name", stopName);
                            selectEl.add(option);

                            if (completed === limit) {
                                document.getElementById("stopSelectionArea").style.display = "block";
                                document.getElementById("cancelSearchBtn").style.display = "none";
                                msgEl.innerText = "";
                            }
                        });
                    })(allStops[i], i);
                }
            });
        });
    }

    function saveBusSetting() {
        var selectEl = document.getElementById("stopSelect");
        if (selectEl.selectedIndex === -1) return;
        
        var selectedOption = selectEl.options[selectEl.selectedIndex];
        userStopId = selectedOption.value;
        userStopName = selectedOption.getAttribute("data-name");
        
        localStorage.setItem("kmb_stop_id", userStopId);
        localStorage.setItem("kmb_stop_name", userStopName);
        
        closeBusSettings();
        document.getElementById("bus-list").innerHTML = '<div style="padding:20px;text-align:center;color:#8E8E93;">載入新車站資料中...</div>';
        updateLocalTime();
        updateBusData();
    }

    function init() {
        updateLocalTime();
        updateWorldClocks();
        updateWeatherData();
        updateBusData();

        setInterval(updateLocalTime, 1000); 
        setInterval(updateWorldClocks, 60000);
        setInterval(updateBusData, 60000); 
        setInterval(updateWeatherData, 15 * 60000);
    }

    return {
        init: init,
        updateBusData: function() {
            document.getElementById("bus-list").innerHTML = '<div style="padding: 20px; text-align: center; color:#8E8E93;">更新中...</div>';
            updateBusData();
        },
        updateWeatherData: function() { updateWeatherData(); },
        openBusSettings: openBusSettings,
        closeBusSettings: closeBusSettings,
        searchRouteStops: searchRouteStops,
        saveBusSetting: saveBusSetting
    };
})();

window.onload = function() { app.init(); };
</script>

</body>
</html>
