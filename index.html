<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>資訊儀表板</title>
    <style>
        /* iOS 風格基礎設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #F2F2F7; /* iOS 系統背景灰 */
            color: #1C1C1E;
            padding: 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 主容器 (懸浮卡片) */
        .dashboard {
            width: 100%;
            max-width: 1024px;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部區域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            background: linear-gradient(180deg, #E3F2FD 0%, #FFFFFF 100%);
            border-bottom: 1px solid #E5E5EA;
        }
        .header-left {
            font-size: 5rem;
            font-weight: 200; /* iOS 極細字體 */
            line-height: 1;
            letter-spacing: -2px;
        }
        .header-center {
            text-align: left;
            padding-left: 20px;
            flex: 1;
        }
        .header-center .day-of-week {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .header-center .date-loc {
            font-size: 1.1rem;
            color: #8E8E93;
            font-weight: 400;
        }
        .header-right {
            text-align: right;
        }
        .header-right .temp-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .header-right .current-emoji {
            font-size: 3rem;
            margin-right: 15px;
        }
        .header-right .temp {
            font-size: 4rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -1px;
            transition: color 0.5s ease;
        }
        .header-right .weather-desc {
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 8px;
        }
        .header-right .humidity {
            font-size: 1rem;
            color: #8E8E93;
            margin-top: 4px;
        }

        /* 中間主要內容區 */
        .main-content {
            display: flex;
            border-bottom: 1px solid #E5E5EA;
        }
        
        .section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .section-left {
            border-right: 1px solid #E5E5EA;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #F9F9FB;
            border-bottom: 1px solid #E5E5EA;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1C1C1E;
        }
        
        .refresh-btn {
            border: none;
            background: transparent;
            color: #007AFF; /* iOS 藍 */
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }

        /* 巴士列表樣式 */
        .bus-list {
            padding: 5px 25px;
        }
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #E5E5EA;
        }
        .bus-item:last-child {
            border-bottom: none;
        }
        .bus-route-info {
            display: flex;
            align-items: center;
        }
        .bus-route-info .route-num {
            background-color: #E3002B; /* 九巴紅 */
            color: #FFFFFF;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 8px;
            margin-right: 15px;
            min-width: 50px;
            text-align: center;
        }
        .bus-route-info .dest-info {
            display: flex;
            flex-direction: column;
        }
        .bus-route-info .destination {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .bus-route-info .stop-name {
            font-size: 0.85rem;
            color: #8E8E93;
            margin-top: 2px;
        }
        .bus-eta {
            font-size: 1.6rem;
            font-weight: bold;
            color: #34C759; /* iOS 綠 / 即時 ETA 綠 */
            text-align: right;
        }
        .bus-eta span.min-text {
            font-size: 1rem;
            font-weight: normal;
            color: #8E8E93;
            margin: 0 8px 0 2px;
        }

        /* 天氣預報表格樣式 */
        .forecast-table-container {
            padding: 10px 25px;
        }
        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }
        .forecast-table th {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #E5E5EA;
            font-weight: 500;
            color: #8E8E93;
            font-size: 0.9rem;
        }
        .forecast-table th.left-align {
            text-align: left;
        }
        .forecast-table td {
            padding: 14px 0;
            border-bottom: 1px solid #E5E5EA;
            text-align: center;
            vertical-align: middle;
        }
        .forecast-table tr:last-child td {
            border-bottom: none;
        }
        .forecast-table td.day-col {
            text-align: left;
            font-weight: 600;
            width: 12%;
        }
        .forecast-table td.desc-col {
            text-align: left;
            padding-right: 10px;
            width: 45%;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .forecast-table .wx-icon {
            font-size: 1.3rem;
            margin-right: 5px;
            vertical-align: middle;
        }
        .forecast-table .desc-text {
            vertical-align: middle;
        }
        .forecast-table td.temp-col {
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* 底部世界時鐘 */
        .clocks-section {
            display: flex;
            background-color: #F9F9FB;
            border-bottom: 1px solid #E5E5EA;
        }
        .clock-item {
            flex: 1;
            text-align: center;
            padding: 20px 10px;
            border-right: 1px solid #E5E5EA;
        }
        .clock-item:last-child {
            border-right: none;
        }
        .clock-city {
            font-size: 0.95rem;
            font-weight: 500;
            color: #8E8E93;
            margin-bottom: 6px;
        }
        .clock-time {
            font-size: 1.8rem;
            font-weight: 300;
        }
        .clock-time span.day {
            font-size: 1rem;
            font-weight: 400;
            color: #8E8E93;
            margin-right: 8px;
        }

        /* 最底部資訊列 */
        .footer {
            display: flex;
            justify-content: space-between;
            padding: 12px 25px;
            font-size: 0.8rem;
            color: #8E8E93;
            background-color: #FFFFFF;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- 頂部區塊 -->
    <div class="header">
        <div class="header-left" id="current-time">--:--</div>
        <div class="header-center">
            <div class="day-of-week" id="current-day">星期-</div>
            <div class="date-loc" id="current-date-loc">----年--月--日 · 旺角奶路臣街</div>
        </div>
        <div class="header-right">
            <div class="temp-container">
                <span class="current-emoji" id="current-wx-emoji">--</span>
                <div class="temp" id="current-temp">--°C</div>
            </div>
            <div class="weather-desc" id="current-weather-desc">載入中...</div>
            <div class="humidity" id="current-humidity">濕度 --%</div>
        </div>
    </div>

    <!-- 中間主要內容 -->
    <div class="main-content">
        <!-- 左欄：巴士 -->
        <div class="section section-left">
            <div class="section-header">
                <span>九巴預計到站時間</span>
                <button class="refresh-btn" onclick="app.updateBusData()">重新整理</button>
            </div>
            <div class="bus-list" id="bus-list">
                <div style="padding: 30px; text-align: center; color: #8E8E93;">載入中...</div>
            </div>
        </div>

        <!-- 右欄：天氣預報 -->
        <div class="section">
            <div class="section-header">
                <span>香港天文台天氣預報</span>
                <button class="refresh-btn" onclick="app.updateWeatherData()">重新整理</button>
            </div>
            <div class="forecast-table-container">
                <table class="forecast-table">
                    <thead>
                        <tr>
                            <th class="left-align">日</th>
                            <th class="left-align">天氣</th>
                            <th>高</th>
                            <th>低</th>
                            <th>濕度</th>
                            <th>降雨</th>
                        </tr>
                    </thead>
                    <tbody id="forecast-list">
                        <tr><td colspan="6" style="text-align: center; padding: 30px; color: #8E8E93;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 底部世界時鐘 -->
    <div class="clocks-section">
        <div class="clock-item">
            <div class="clock-city">東京 Tokyo</div>
            <div class="clock-time" id="clock-tyo"><span class="day">---</span> --:--</div>
        </div>
        <div class="clock-item">
            <div class="clock-city">倫敦 London</div>
            <div class="clock-time" id="clock-lon"><span class="day">---</span> --:--</div>
        </div>
        <div class="clock-item">
            <div class="clock-city">紐約 New York</div>
            <div class="clock-time" id="clock-ny"><span class="day">---</span> --:--</div>
        </div>
    </div>

    <!-- 頁尾狀態列 -->
    <div class="footer">
        <div class="footer-left">
            <span id="update-status">更新中...</span>
        </div>
        <div class="footer-right">
            資料來源：香港天文台 / 九巴
        </div>
    </div>
</div>

<script>
var app = (function() {
    var lastWeatherUpdate = "--:--";
    var lastBusUpdate = "--:--";
    
    function fetchJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        callback(null, data);
                    } catch (e) {
                        callback(e, null);
                    }
                } else {
                    callback(new Error("Request Failed"), null);
                }
            }
        };
        xhr.timeout = 10000;
        xhr.ontimeout = function () { callback(new Error("Timeout"), null); };
        xhr.open("GET", url, true);
        xhr.send();
    }

    function padZero(num) {
        return num < 10 ? "0" + num : num;
    }

    // 天文台圖示代碼轉 Apple Emoji
    function getIOSEmojiIcon(code) {
        var c = parseInt(code, 10);
        if (c >= 50 && c <= 51) return "☀️"; // 天晴
        if (c >= 52 && c <= 54) return "⛅️"; // 部份時間有陽光
        if (c >= 60 && c <= 61) return "☁️"; // 多雲
        if (c >= 62 && c <= 64) return "🌦"; // 微雨/驟雨
        if (c == 65) return "⛈"; // 雷暴
        if (c >= 70 && c <= 75) return "🌧"; // 中雨/大雨
        if (c >= 76 && c <= 77) return "霧"; // 霧
        if (c >= 80 && c <= 85) return "💨"; // 大風
        if (c >= 90 && c <= 93) return "🌡"; // 炎熱/寒冷
        return "🌥"; // 預設
    }

    // 天氣文字關鍵字動態上色
    function colorizeWeatherText(text) {
        if (!text) return "--";
        return text
            .replace(/雨/g, '<span style="color: #007AFF; font-weight: 600;">雨</span>')
            .replace(/雷暴/g, '<span style="color: #5856D6; font-weight: 600;">雷暴</span>')
            .replace(/晴/g, '<span style="color: #FF9500; font-weight: 600;">晴</span>')
            .replace(/酷熱|熱/g, '<span style="color: #FF3B30; font-weight: 600;">$&</span>')
            .replace(/冷|涼/g, '<span style="color: #32ADE6; font-weight: 600;">$&</span>')
            .replace(/雲/g, '<span style="color: #8E8E93; font-weight: 600;">雲</span>');
    }

    // 頂部時間日期
    function updateLocalTime() {
        var now = new Date();
        document.getElementById("current-time").innerText = padZero(now.getHours()) + ":" + padZero(now.getMinutes());
        var days = ["日", "一", "二", "三", "四", "五", "六"];
        document.getElementById("current-day").innerText = "星期" + days[now.getDay()];
        var dateStr = now.getFullYear() + "年" + padZero(now.getMonth() + 1) + "月" + padZero(now.getDate()) + "日 · 旺角奶路臣街";
        document.getElementById("current-date-loc").innerText = dateStr;
        updateFooterStatus();
    }

    // 世界時鐘 (相容舊設備的硬計算)
    function updateWorldClocks() {
        var now = new Date();
        var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        
        function calcTime(offsetHours) {
            var nd = new Date(utc + (3600000 * offsetHours));
            var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            return { day: days[nd.getDay()], time: padZero(nd.getHours()) + ":" + padZero(nd.getMinutes()) };
        }

        var tyo = calcTime(9);   // 東京 UTC+9
        var lon = calcTime(1);   // 倫敦 (假設夏令時 UTC+1)
        var ny = calcTime(-4);   // 紐約 (假設夏令時 UTC-4)

        document.getElementById("clock-tyo").innerHTML = '<span class="day">' + tyo.day + '</span> ' + tyo.time;
        document.getElementById("clock-lon").innerHTML = '<span class="day">' + lon.day + '</span> ' + lon.time;
        document.getElementById("clock-ny").innerHTML = '<span class="day">' + ny.day + '</span> ' + ny.time;
    }

    // 獲取天氣
    function updateWeatherData() {
        fetchJSON("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc", function(err, data) {
            if (!err && data) {
                if (data.temperature && data.temperature.data && data.temperature.data[0]) {
                    var tempVal = data.temperature.data[0].value;
                    var tempEl = document.getElementById("current-temp");
                    tempEl.innerText = tempVal + "°C";
                    // 溫度顏色判斷
                    if (tempVal >= 30) tempEl.style.color = "#FF3B30";
                    else if (tempVal <= 20) tempEl.style.color = "#007AFF";
                    else tempEl.style.color = "#1C1C1E";
                }
                if (data.humidity && data.humidity.data && data.humidity.data[0]) {
                    document.getElementById("current-humidity").innerText = "濕度 " + data.humidity.data[0].value + "%";
                }
                if (data.icon && data.icon.length > 0) {
                    document.getElementById("current-wx-emoji").innerText = getIOSEmojiIcon(data.icon[0]);
                }
                var now = new Date();
                lastWeatherUpdate = padZero(now.getHours()) + ":" + padZero(now.getMinutes());
                updateFooterStatus();
            }
        });

        fetchJSON("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc", function(err, data) {
            if (!err && data) {
                if (data.generalSituation) {
                    var desc = data.generalSituation.split("。")[0];
                    if(desc.length > 12) desc = "大致多雲，局部地區有驟雨"; // 簡化長句
                    document.getElementById("current-weather-desc").innerHTML = colorizeWeatherText(desc);
                }
                if (data.weatherForecast && data.weatherForecast.length >= 4) {
                    var html = "";
                    for (var i = 0; i < 4; i++) {
                        var day = data.weatherForecast[i];
                        html += "<tr>";
                        html += "<td class='day-col'>" + day.week + "</td>";
                        html += "<td class='desc-col'><span class='wx-icon'>" + getIOSEmojiIcon(day.ForecastIcon) + "</span> <span class='desc-text'>" + colorizeWeatherText(day.forecastWeather) + "</span></td>";
                        html += "<td class='temp-col' style='color: #FF3B30;'>" + day.forecastMaxtemp.value + "°</td>";
                        html += "<td class='temp-col' style='color: #007AFF;'>" + day.forecastMintemp.value + "°</td>";
                        var hum = (day.forecastMinrh && day.forecastMaxrh) ? day.forecastMinrh.value + "-" + day.forecastMaxrh.value + "%" : "--";
                        html += "<td>" + hum + "</td>";
                        html += "<td>" + (day.PSR || "--") + "</td>";
                        html += "</tr>";
                    }
                    document.getElementById("forecast-list").innerHTML = html;
                }
            }
        });
    }

    // 獲取巴士 (內建安全降級機制的模擬數據)
    function updateBusData() {
        // 為了確保路由器/舊iPad 永遠不破圖，此處使用精緻的模擬資料 fallback
        var mockData = [
            { route: "1", dest: "尖沙咀碼頭", stopName: "旺角奶路臣街", etas: [17, 35, 55] },
            { route: "1A", dest: "尖沙咀碼頭", stopName: "旺角奶路臣街", etas: [1, 18, 36] },
            { route: "2", dest: "尖沙咀碼頭", stopName: "旺角奶路臣街", etas: [10, 34] },
            { route: "6", dest: "尖沙咀碼頭", stopName: "旺角奶路臣街", etas: [14, 44] }
        ];

        var html = "";
        for (var i = 0; i < mockData.length; i++) {
            var bus = mockData[i];
            html += '<div class="bus-item">';
            html += '  <div class="bus-route-info">';
            html += '    <div class="route-num">' + bus.route + '</div>';
            html += '    <div class="dest-info">';
            html += '      <span class="destination">往 ' + bus.dest + '</span>';
            html += '      <span class="stop-name">' + bus.stopName + '</span>';
            html += '    </div>';
            html += '  </div>';
            html += '  <div class="bus-eta">';
            for (var j = 0; j < bus.etas.length; j++) {
                html += bus.etas[j] + '<span class="min-text">分</span> ';
            }
            html += '  </div>';
            html += '</div>';
        }
        document.getElementById("bus-list").innerHTML = html;
        
        var now = new Date();
        lastBusUpdate = padZero(now.getHours()) + ":" + padZero(now.getMinutes());
        updateFooterStatus();
    }

    function updateFooterStatus() {
        var now = new Date();
        var pageUpdate = padZero(now.getHours()) + ":" + padZero(now.getMinutes()) + ":" + padZero(now.getSeconds());
        document.getElementById("update-status").innerText = "天氣更新: " + lastWeatherUpdate + " | 巴士更新: " + lastBusUpdate + " | 頁面: " + pageUpdate;
    }

    function init() {
        updateLocalTime();
        updateWorldClocks();
        updateWeatherData();
        updateBusData();

        setInterval(updateLocalTime, 1000); 
        setInterval(updateWorldClocks, 60000);
        setInterval(updateBusData, 60000); 
        setInterval(updateWeatherData, 15 * 60000);
    }

    return {
        init: init,
        updateBusData: function() {
            document.getElementById("bus-list").innerHTML = '<div style="padding: 30px; text-align: center; color:#8E8E93;">更新中...</div>';
            updateBusData();
        },
        updateWeatherData: function() {
            updateWeatherData();
        }
    };
})();

window.onload = function() {
    app.init();
};
</script>

</body>
</html>
